name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      - name: 🔥 Scaffold de arquivos Flutter/Android faltantes (flutter create seguro)
        run: |
          set -e
          echo "::group::Backup de arquivos customizados"
          # Faz backup de TUDO que escrevemos manualmente (será restaurado depois)
          BACKUP_DIR=$(mktemp -d)
          cp -r app/lib                          "$BACKUP_DIR/lib"
          cp app/pubspec.yaml                     "$BACKUP_DIR/pubspec.yaml"
          cp app/pubspec.lock 2>/dev/null || true "$BACKUP_DIR/pubspec.lock" 2>/dev/null || true
          cp app/analysis_options.yaml 2>/dev/null || true "$BACKUP_DIR/analysis_options.yaml" 2>/dev/null || true
          cp -r app/.gitignore 2>/dev/null || true "$BACKUP_DIR/app.gitignore" 2>/dev/null || true
          cp -r app/android/app/src/main/AndroidManifest.xml    "$BACKUP_DIR/AndroidManifest.xml"
          cp -r app/android/app/src/main/res                    "$BACKUP_DIR/res-custom"
          cp -r app/android/app/src/main/kotlin                  "$BACKUP_DIR/kotlin-custom" 2>/dev/null || true
          cp app/android/app/build.gradle                        "$BACKUP_DIR/app-build.gradle"
          cp app/android/build.gradle                            "$BACKUP_DIR/root-build.gradle"
          cp app/android/settings.gradle                         "$BACKUP_DIR/settings.gradle"
          cp app/android/gradle.properties                       "$BACKUP_DIR/gradle.properties"
          cp app/android/gradle/wrapper/gradle-wrapper.properties "$BACKUP_DIR/gradle-wrapper.properties"
          cp -r app/ios/Runner/Info.plist                        "$BACKUP_DIR/ios-Info.plist" 2>/dev/null || true
          echo "Backup concluido em: $BACKUP_DIR"
          ls -la "$BACKUP_DIR"
          echo "::endgroup::"

          echo "::group::Executando flutter create (gera TODOS arquivos padrão faltantes)"
          # Remove a pasta app TEMPORARIAMENTE para o flutter create criar do zero
          rm -rf app
          mkdir -p app
          # Cria o projeto base do flutter (com arquivos nativos ANDROID + iOS corretos)
          cd app
          flutter create --org com.example --project-name video_downloader --platforms=android,ios .
          cd ..
          echo "Flutter create OK"
          echo "::endgroup::"

          echo "::group::Restaurando nossos arquivos customizados por cima"
          # lib e pubspec (sempre substituímos — é 100% nosso código)
          rm -rf app/lib
          cp -r "$BACKUP_DIR/lib" app/lib
          cp    "$BACKUP_DIR/pubspec.yaml" app/pubspec.yaml
          [ -f "$BACKUP_DIR/pubspec.lock" ] && cp "$BACKUP_DIR/pubspec.lock" app/pubspec.lock || true
          [ -f "$BACKUP_DIR/analysis_options.yaml" ] && cp "$BACKUP_DIR/analysis_options.yaml" app/analysis_options.yaml || true

          # AndroidManifest customizado (tem o SHARE SHEET — NÃO PODE SER PERDIDO)
          cp "$BACKUP_DIR/AndroidManifest.xml" app/android/app/src/main/AndroidManifest.xml
          echo "  - AndroidManifest restaurado (Share Sheet preservado!)"

          # Resources customizados (styles, colors, network config, launch_background, ic_foreground, etc)
          if [ -d "$BACKUP_DIR/res-custom" ]; then
            cp -r "$BACKUP_DIR/res-custom/"* app/android/app/src/main/res/ 2>/dev/null || true
            echo "  - Resources customizados restaurados"
          fi

          # Fontes kotlin (nossa MainActivity)
          if [ -d "$BACKUP_DIR/kotlin-custom" ]; then
            cp -r "$BACKUP_DIR/kotlin-custom/"* app/android/app/src/main/kotlin/ 2>/dev/null || true
            echo "  - Fontes Kotlin restauradas"
          fi

          # Build gradles / settings / properties (se o nosso tinha algo especial)
          [ -f "$BACKUP_DIR/app-build.gradle" ]       && cp "$BACKUP_DIR/app-build.gradle"       app/android/app/build.gradle      || true
          [ -f "$BACKUP_DIR/root-build.gradle" ]      && cp "$BACKUP_DIR/root-build.gradle"      app/android/build.gradle           || true
          [ -f "$BACKUP_DIR/settings.gradle" ]        && cp "$BACKUP_DIR/settings.gradle"        app/android/settings.gradle        || true
          [ -f "$BACKUP_DIR/gradle.properties" ]      && cp "$BACKUP_DIR/gradle.properties"      app/android/gradle.properties      || true
          [ -f "$BACKUP_DIR/gradle-wrapper.properties" ] && cp "$BACKUP_DIR/gradle-wrapper.properties" app/android/gradle/wrapper/gradle-wrapper.properties || true

          # Info.plist iOS
          if [ -f "$BACKUP_DIR/ios-Info.plist" ]; then
            cp "$BACKUP_DIR/ios-Info.plist" app/ios/Runner/Info.plist
            echo "  - iOS Info.plist restaurado"
          fi

          echo "::endgroup::"
          echo "✅ Scaffold concluido. Estrutura Flutter/Android agora 100% completa."

      - name: Create .env placeholder (se necessário)
        run: echo "API_BASE_URL=${{ secrets.API_BASE_URL }}" > app/.env || true

      - name: Flutter Doctor
        working-directory: app
        run: flutter doctor -v

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: app
        run: flutter analyze --no-fatal-infos || true

      - name: Clean previous builds
        working-directory: app
        run: flutter clean

      - name: Build APK Release (armeabi-v7a, arm64-v8a, x86_64 - universal)
        working-directory: app
        run: flutter build apk --release --no-shrink

      - name: Build APK Split por ABI (menor tamanho)
        working-directory: app
        run: flutter build apk --release --split-per-abi --no-shrink || true

      - name: Build App Bundle (AAB - para Play Store)
        working-directory: app
        run: flutter build appbundle --release --no-shrink || true

      - name: Listar arquivos gerados
        run: |
          echo "=== APKs ==="
          find app/build/app/outputs -name "*.apk" -type f || true
          echo "=== AAB ==="
          find app/build/app/outputs -name "*.aab" -type f || true
          echo "=== Tamanhos ==="
          du -h app/build/app/outputs/apk/release/*.apk 2>/dev/null || true

      - name: Upload APK Universal
        uses: actions/upload-artifact@v4
        with:
          name: tudobaixa-APK-universal
          path: app/build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK ARM64 (aparelhos modernos)
        uses: actions/upload-artifact@v4
        if: hashFiles('app/build/app/outputs/apk/release/app-arm64-v8a-release.apk') != ''
        with:
          name: tudobaixa-APK-arm64-v8a
          path: app/build/app/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload APK armeabi-v7a (aparelhos antigos)
        uses: actions/upload-artifact@v4
        if: hashFiles('app/build/app/outputs/apk/release/app-armeabi-v7a-release.apk') != ''
        with:
          name: tudobaixa-APK-armeabi-v7a
          path: app/build/app/outputs/apk/release/app-armeabi-v7a-release.apk
          if-no-files-found: ignore
          retention-days: 90

      - name: Upload App Bundle (AAB)
        uses: actions/upload-artifact@v4
        if: hashFiles('app/build/app/outputs/bundle/release/app-release.aab') != ''
        with:
          name: tudobaixa-AppBundle-AAB
          path: app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: ignore
          retention-days: 90

      - name: Resumo final
        run: |
          echo "## ✅ Build concluída com sucesso!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Arquivos gerados disponíveis na aba **Artifacts** desta execução." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Universal**: instala em QUALQUER Android (recomendado para testes)" >> $GITHUB_STEP_SUMMARY
          echo "- **APK arm64-v8a**: aparelhos modernos (menor tamanho)" >> $GITHUB_STEP_SUMMARY
          echo "- **APK armeabi-v7a**: aparelhos mais antigos" >> $GITHUB_STEP_SUMMARY
          echo "- **AAB**: para publicar na Google Play Store" >> $GITHUB_STEP_SUMMARY
