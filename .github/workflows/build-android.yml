name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Confirm Flutter project files
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle
          echo "Flutter project root: app/"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Ensure Gradle wrapper JAR
        working-directory: app/android
        run: |
          set -e
          WRAPPER_DIR="gradle/wrapper"
          JAR="$WRAPPER_DIR/gradle-wrapper.jar"
          mkdir -p "$WRAPPER_DIR"
          if [ -f "$JAR" ]; then
            echo "gradle-wrapper.jar already present"
          else
            echo "Downloading gradle-wrapper.jar"
            curl -fsSL -o "$JAR" \
              "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          fi

      - name: Decode release keystore (if available)
        working-directory: app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set +e
          if [ -n "$KEYSTORE_BASE64" ] && [ "$KEYSTORE_BASE64" != "" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            if [ -f release-keystore.jks ]; then
              echo "Keystore decoded successfully:"
              ls -lh release-keystore.jks
            else
              echo "WARNING: Failed to decode keystore"
            fi
          else
            echo "KEYSTORE_BASE64 not set - will use debug signing (fallback)"
          fi

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK Release
        working-directory: app
        env:
          API_URL: ${{ secrets.API_URL }}
          KEYSTORE_FILE: '../android/release-keystore.jks'
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          API_ARG=""
          if [ -n "$API_URL" ]; then
            API_ARG="--dart-define=API_URL=$API_URL"
          fi
          if [ -f ../android/release-keystore.jks ]; then
            echo "Signing mode: RELEASE keystore"
          else
            echo "Signing mode: DEBUG keystore (fallback - no release keystore configured)"
          fi
          echo "API URL defined: ${API_URL:-<no, using default>}"
          flutter build apk --release $API_ARG

      - name: Prepare APK artifact
        run: |
          set -e
          mkdir -p build/app/outputs/apk/release
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp -f build/app/outputs/flutter-apk/app-release.apk \
              build/app/outputs/apk/release/app-release.apk
          fi
          if [ ! -f build/app/outputs/apk/release/app-release.apk ]; then
            echo "APK not found. Listing outputs:"
            find build/app/outputs -name '*.apk' -type f || true
            exit 1
          fi
          ls -lh build/app/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        working-directory: app
        run: |
          APK="build/app/outputs/apk/release/app-release.apk"
          if command -v apksigner >/dev/null 2>&1; then
            echo "--- APK Signature Info ---"
            apksigner verify --print-certs "$APK" || true
          else
            echo "apksigner not available, using jarsigner fallback"
            jarsigner -verify -verbose -certs "$APK" || true
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tudobaixa-apk-release
          path: app/build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90

      - name: Upload APK to release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/app/outputs/apk/release/app-release.apk
          generate_release_notes: true
