name: Build Android APK

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Confirm Flutter project files
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle
          echo "Flutter project root: app/"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Ensure Gradle wrapper JAR
        working-directory: app/android
        run: |
          set -e
          WRAPPER_DIR="gradle/wrapper"
          JAR="$WRAPPER_DIR/gradle-wrapper.jar"
          mkdir -p "$WRAPPER_DIR"
          if [ -f "$JAR" ]; then
            echo "gradle-wrapper.jar already present"
          else
            echo "Downloading gradle-wrapper.jar"
            curl -fsSL -o "$JAR" \
              "https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar"
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Prepare APK artifact
        run: |
          set -e
          mkdir -p build/app/outputs/apk/release
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp -f build/app/outputs/flutter-apk/app-release.apk \
              build/app/outputs/apk/release/app-release.apk
          fi
          if [ ! -f build/app/outputs/apk/release/app-release.apk ]; then
            echo "APK not found. Listing outputs:"
            find build/app/outputs -name '*.apk' -type f || true
            exit 1
          fi
          ls -lh build/app/outputs/apk/release/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tudobaixa-apk-release
          path: app/build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
