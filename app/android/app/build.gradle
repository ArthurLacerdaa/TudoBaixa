plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader("UTF-8") { reader ->
        keystoreProperties.load(reader)
    }
} else {
    keystoreProperties.setProperty("storeFile", System.getenv("KEYSTORE_FILE") ?: "")
    keystoreProperties.setProperty("storePassword", System.getenv("KEYSTORE_PASSWORD") ?: "")
    keystoreProperties.setProperty("keyAlias", System.getenv("KEY_ALIAS") ?: "")
    keystoreProperties.setProperty("keyPassword", System.getenv("KEY_PASSWORD") ?: "")
}

def storeFileProp = keystoreProperties.getProperty("storeFile")?.trim()
def releaseKeystoreFile = null
def hasReleaseKeystore = false

if (storeFileProp && !storeFileProp.isEmpty()) {
    try {
        if (new File(storeFileProp).isAbsolute()) {
            releaseKeystoreFile = new File(storeFileProp)
        } else {
            releaseKeystoreFile = rootProject.file(storeFileProp)
        }
        hasReleaseKeystore = releaseKeystoreFile.exists()
    } catch (Exception ignored) {
        hasReleaseKeystore = false
    }
}

android {
    namespace "com.tudobaixa.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
                storeFile releaseKeystoreFile
                storePassword keystoreProperties.getProperty("storePassword")
            }
        }
    }

    defaultConfig {
        applicationId "com.tudobaixa.app"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}
